
name: Build Samson Calisthenics APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.html'
      - 'images/**'
      - 'logo.png'
      - 'app/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Locate HTML and prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          HTML_FILE="samson_calesthenics_app.html"

          if [ ! -f "$HTML_FILE" ]; then
            echo "ERROR: $HTML_FILE not found in repository root."
            echo "Update HTML_FILE in this workflow to match your exact filename."
            echo "HTML files found:"
            find . -maxdepth 1 -type f -iname "*.html"
            exit 1
          fi

          mkdir -p app/src/main/assets/images
          cp "$HTML_FILE" app/src/main/assets/index.html

          if [ -d images ]; then
            cp -r images/. app/src/main/assets/images/
          fi

          if [ -f logo.png ]; then
            cp logo.png app/src/main/assets/images/logo.png
          fi

          mkdir -p app/src/main/java/com/samson/calistenics

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SamsonCalisthenics"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.samson.calistenics'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.samson.calistenics'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Samson Calisthenics"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/samson/calistenics/MainActivity.java <<'EOF'
          package com.samson.calistenics;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          echo "HTML and image assets prepared."
          find app/src/main/assets -maxdepth 2 -type f

      - name: Build APK
        run: |
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samson-Calisthenics-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
